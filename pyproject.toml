[project]
name = "simplify-autoresearch-v2"
version = "0.3.0"
description = "A provenance-first, queue-driven autonomous research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoresearch = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoresearch"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Vendored upstream training code and generated run state are not ours to lint.
exclude = ["runs/code", "runs/state", ".venv"]
line-length = 100
target-version = "py310"
